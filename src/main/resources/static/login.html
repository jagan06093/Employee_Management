
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
   
  <style type="text/css">
    * {
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

/* ===== BODY ===== */
body {
    margin: 0;
    padding: 0;
    background: linear-gradient(120deg, #2c3e50, #3498db);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
   
    
   
  
}
/* ===== LOGIN CONTAINER ===== */
.container {
    background: #ffffff;
    width: 350px;
    padding: 30px 25px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    text-align: center;
}

/* ===== HEADING ===== */
.container h2 {
    margin-bottom: 25px;
    color: #2c3e50;
}

/* ===== INPUT FIELDS ===== */
.container input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
}

.container input:focus {
    outline: none;
    border-color: #3498db;
}

/* ===== BUTTONS ===== */
.container button {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    border: none;
    border-radius: 6px;
    background: #3498db;
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.3s ease;
}

.container button:hover {
    background: #2980b9;
}

/* ===== REGISTER BUTTON ===== */
.container button:last-of-type {
    background: #2ecc71;
}

.container button:last-of-type:hover {
    background: #27ae60;
}

/* ===== ERROR MESSAGE ===== */
.error {
    margin-top: 15px;
    color: #e74c3c;
    font-size: 14px;
    min-height: 18px;
}

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 400px) {
    .container {
        width: 90%;
    }
}
    
    
    
    </style>
</head>
<body>

<div class="container">
    <h2>Login</h2>

    <input 
        type="text" 
        id="username" 
        placeholder="Username">

    <input 
        type="password" 
        id="password" 
        placeholder="Password">

    <button onclick="login()">Login</button>
    <button onclick="goToRegister()">Register</button>

    
    <p id="msg" class="error"></p>
</div>


<script src="js/login.js"></script>

</body>
</html>
